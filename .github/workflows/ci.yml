name: Validate source and container

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: volleyball_owner
          POSTGRES_DB: postgres
          # This credential exists only for this disposable CI service, never an app account.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U volleyball_owner -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.14.8'
      - name: Install pinned dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Configure disposable owner and RLS runtime test connections
        env:
          CI_POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import base64,os,secrets
          from pathlib import Path
          import psycopg
          from psycopg import sql
          owner_password=os.environ['CI_POSTGRES_PASSWORD']
          runtime_password=secrets.token_urlsafe(32)
          secret_key=secrets.token_hex(48)
          mfa_key=base64.urlsafe_b64encode(os.urandom(32)).decode()
          for value in [owner_password,runtime_password,secret_key,mfa_key]:print('::add-mask::'+value)
          with psycopg.connect(host='127.0.0.1',port=5432,dbname='postgres',user='volleyball_owner',password=owner_password,autocommit=True) as connection:
              connection.execute(sql.SQL('CREATE ROLE volleyball_app LOGIN PASSWORD {} NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS').format(sql.Literal(runtime_password)))
              connection.execute('CREATE DATABASE volleyball_test OWNER volleyball_owner')
          owner=f'postgresql+psycopg://volleyball_owner:{owner_password}@127.0.0.1:5432/volleyball_test'
          runtime=f'postgresql+psycopg://volleyball_app:{runtime_password}@127.0.0.1:5432/volleyball_test'
          values={'DATABASE_URL':runtime,'MIGRATION_DATABASE_URL':owner,'TEST_DATABASE_URL':owner,'TEST_RUNTIME_URL':runtime,'SECRET_KEY':secret_key,'MFA_ENCRYPTION_KEY':mfa_key,'APP_ENV':'test','SESSION_COOKIE_SECURE':'false','PUBLIC_BASE_URL':'http://127.0.0.1:5050'}
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              stream.writelines(f'{key}={value}\n' for key,value in values.items())
          PY
      - name: Apply test migrations as owner
        run: python -m alembic upgrade head
      - name: Run complete PostgreSQL and unit test suite
        run: python -m pytest -q
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Python and operator script syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q volleyball migrations scripts deploy/docker
          while IFS= read -r file; do bash -n "$file"; done < <(find deploy -name '*.sh' -type f)
      - name: Build clean application image
        run: docker build --tag volleyball-manager:validation .
