name: volleyball-manager

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    env_file:
      - ${VM_ROOT:-/opt/volleyball-manager}/config/postgres.env
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=100
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
    volumes:
      # PostgreSQL 18+ stores PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ${VM_ROOT:-/opt/volleyball-manager}/deploy/docker/10-init-roles.sh
        target: /docker-entrypoint-initdb.d/10-init-roles.sh
        read_only: true
        bind:
          create_host_path: false
    networks:
      - database
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=\"$$POSTGRES_USER\" --dbname=postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in /opt/volleyball-manager/config/release.env}
    restart: unless-stopped
    init: true
    env_file:
      - ${VM_ROOT:-/opt/volleyball-manager}/config/runtime.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - type: bind
        source: ${VM_ROOT:-/opt/volleyball-manager}/data/instance
        target: /app/instance
        bind:
          create_host_path: false
    networks:
      - database
      - egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:
    name: volleyball-manager-postgres-data

networks:
  database:
    name: volleyball-manager-database
    internal: true
  egress:
    name: volleyball-manager-egress
